# JSONTestSuite, the parsing half. Nicolas Seriot's corpus from the article
# "Parsing JSON is a Minefield", which is the closest thing there is to a
# conformance suite for RFC 8259. Three hundred and eighteen files, pinned at
# commit 1ef36fa01286573e846ac449e8683f8833c5b26a.
#
# The first letter of a name is the verdict. `y_` has to be accepted, `n_` has
# to be refused, and `i_` is a case the standard leaves open, where an
# implementation may do either so long as it decides on purpose.
# `tools/gen/jsonsuite.py` embeds the whole corpus in
# `tests/generated/jsonsuite.mojo` and `tests/encoding/json/test_suite.mojo`
# runs `valid` over every file, with the `i_` answers written out one by one.
#
# Every file gets its own entry, because that is what this lock file is: a url,
# a digest and a licence for each thing vendored. Three hundred and eighteen of
# them is a lot of lines and each one is the same four, so the block below is
# generated rather than typed, and `pixi run vendor-check` is what reads it.

