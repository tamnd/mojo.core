name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Least privilege by default. A job that needs more asks for it itself.
permissions:
  contents: read

# One run per ref. A new push cancels the old run, except on main where every commit on the branch should have a real result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIXI_VERSION: v0.78.0

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - run: pixi run format-check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - run: pixi run lint
      # A lint that has stopped matching anything reports success forever, so the lints are themselves checked against known violations.
      - run: pixi run lint-selftest
      # The reader that stands in for reflection, against a fixture package it compiles on every run. Everything the generators know about a struct comes through here, and what it reads is the output of a compiler that is still changing.
      - run: pixi run docjson-selftest
      # The codec generator, which writes a codec for a fixture package outside the repository, builds it with warnings on and runs it. Generated code that compiles is not evidence that it is right, so the selftest round trips it.
      - run: pixi run codec-selftest

  generated:
    name: generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          # The oracle environment rather than the default one, because it is the only one with Go, and the Go API index is generated from Go's own manifests.
          # Without Go here the index generator would skip and this job would report success on a check it never ran.
          environments: oracle
          locked: true
          cache: true
      # The Unicode tables, tzdata, the syscall bindings, the Go API index and every generated codec are checked in as well as generated.
      # This rebuilds them and fails on a diff. It is the most valuable check in the list, because generated code drifting from its source surfaces months later somewhere unrelated.
      - run: pixi run -e oracle generated-check
      # The vendored corpora are checked against the digests recorded for them, so that a test suite cannot quietly start testing different bytes.
      - run: pixi run -e oracle vendor-check

  packages:
    name: package graph
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      # Builds every package against only what its PACKAGE.toml declares.
      # A library that only ever builds as a whole has a dependency graph nobody has tested, and the promise that you can take core.json without taking core.crypto.tls is exactly the kind of promise that rots without a check.
      - run: pixi run pkg
      - run: pixi run parity

  warnings:
    name: compile time diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      # A comptime fact cannot be raised as a compile error in Mojo, only as a warning, so every compile time check in this library is a warning that this job promotes to a failure.
      # That makes the warning mechanism load bearing, and load bearing things get tested: tests/warnings/ holds files that are expected to warn, with the count and the text asserted.
      - run: pixi run warnings

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Almost all of this is one compile. The runner generates a single main that calls every test and builds it in one go, so the time grows with the size of the library rather than with the number of tests.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: linux-x86_64
            runner: ubuntu-24.04
          # arm64 is not here for coverage. It is the only runner with a weak memory model, so it is the only place a missing acquire barrier in core.sync will ever show up.
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - name: Record the toolchain
        run: pixi run mojo --version
      # The errno table, the struct layouts and the syscall numbers are platform specific, and this is the only place they can be checked against the platform that will use them.
      - run: pixi run baseline
      # The probes run before the suite and on every platform. Before, because a probe failing names the language assumption that moved and a suite failing only says that something did. On every platform, because the pthread and atomic probes are foreign calls into whatever libc is on the machine, and arm64 is the only runner where a missing barrier would show up at all.
      - run: pixi run probe
      # Before the suite, because a runner that swallows a failing test looks exactly like a suite with nothing wrong in it, and every platform, because the runner builds and runs a binary and that is the part that differs per platform.
      - run: pixi run test-selftest
      - run: pixi run test

  # The same suite under the thread sanitiser. A refcount or a lock that is wrong does not fail an assertion, it corrupts something and the failure arrives later somewhere else, so the plain run says nothing about either.
  #
  # macOS only, and not by choice. On Linux the Mojo runtime links tcmalloc, which assumes a 48-bit address space, and the sanitiser takes that range for its shadow memory, so every binary built with `--sanitize thread` dies in the allocator before it reaches main. There is no flag to build without tcmalloc. macOS uses the system allocator and works.
  #
  # The loss is smaller than it looks: this runner is arm64, so the weak memory model that a missing barrier needs in order to show up at all is still covered. What is not covered is anything that only races under glibc.
  #
  # Sharded, because instrumenting the whole library in one build costs far more than instrumenting it in eight. The whole tree took the better part of an hour and grew from there; a shard of it takes one or two minutes, so the eight of them together are both faster and cheaper than the one was. The split is a contiguous run of the test files in sorted order rather than a round robin, because what a shard pays for is the packages its files reach and files that sort next to each other are in the same package or a neighbouring one, so dealing them round would have every shard reach the whole library and save nothing. tools/mojotest/run.py says this at more length, and its selftest adds the shards back up against the tree so that one cannot quietly drop a file and stay green.
  #
  # The deadline is on the run and the timeout is on the whole job, and they are for different failures. A test that waits for something that never arrives blocks the binary, and a hang is the one failure that says nothing at all, since the tests only print when they fail. Without the deadline the job is cancelled at its own limit hours later and the log holds one line about a limit. With it the suite is sampled first, so the log holds the stack of the thread that was stuck. The job timeout is what is left for the build, and it is deliberately far above what a shard takes, because the time varies with the runner and a cap set near the mean turns that into a red check on a branch with nothing wrong in it.
  race:
    name: race ${{ matrix.shard }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - run: pixi run race --shard ${{ matrix.shard }} --deadline 900

  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # A single required check, so branch protection does not need updating every time the matrix changes.
  ci-ok:
    name: ci ok
    runs-on: ubuntu-24.04
    needs: [format, lint, generated, packages, warnings, test, race]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if anything upstream failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "a required job did not pass"
            exit 1
          fi
          echo "all required jobs passed"
