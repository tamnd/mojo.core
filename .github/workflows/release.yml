name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.78.0
          environments: oracle
          locked: true
          cache: true
      # The full check rather than just the tests, because a release is the one build where the generated code and the parity number being right actually matters to somebody other than us. In the oracle environment, because that is the one with the Go the API index is generated from, and anywhere else the generated check skips the index instead of reading it.
      - run: pixi run -e oracle check

  source:
    name: build the source tarball
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      # A .mojoc is tied to the compiler that produced it and is not a distributable format, so the release artifact is source.
      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="mojo-core-${version}/" \
            -o "mojo-core-${version}.tar.gz" HEAD
      - name: Checksum
        run: sha256sum mojo-core-*.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: |
            mojo-core-*.tar.gz
            SHA256SUMS

  publish:
    name: publish
    runs-on: ubuntu-24.04
    needs: source
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
      # Signed provenance for the tarball, so somebody who downloads it can check it came from this workflow on this repository and not from a mirror that added a line to core.crypto.
      - name: Attest the artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mojo-core-*.tar.gz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.3.4
        with:
          generate_release_notes: true
          files: |
            mojo-core-*.tar.gz
            SHA256SUMS
