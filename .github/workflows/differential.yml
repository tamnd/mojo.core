name: Differential

# Go's tests check the cases Go's authors thought of. This suite checks the cases nobody thought of, by running this library and Go against the same generated input and comparing the bytes.
# It is out of the pull request path on purpose. A run long enough to find anything takes longer than a commit should wait, and a run short enough to gate on would only ever re-find what the last one already fixed.
# A green run today says nothing about tomorrow, because the value is entirely in the cases that have not been generated yet.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: How many cases per area, or empty for what each area asks for
        required: false
        default: ""
      seed:
        description: The seed to use, or empty for the run number
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: differential
  cancel-in-progress: true

jobs:
  # The matrix is read out of tools/differ/cases.toml rather than written here, so that an area lands in the nightly run by being declared and there is no second list to forget.
  # The areas the table in docs/testing.md describes and nobody has written yet are simply not in the file, which is the difference between a plan and a job that fails every night.
  areas:
    name: the declared areas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      # The runner's own python, not pixi's, because reading one TOML file does not need an environment solved for it.
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, tomllib
          with open("tools/differ/cases.toml", "rb") as fh:
              names = sorted(tomllib.load(fh).get("area", {}))
          print("matrix=" + json.dumps(names))
          print("any=" + ("yes" if names else "no"))
          PY

  differ:
    name: ${{ matrix.area }}
    needs: areas
    if: needs.areas.outputs.any == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      # One area finding something says nothing about the others, and the night is worth more with every answer than with the first one.
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.areas.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: oracle
          locked: true
          cache: true
      # No case count unless one was dispatched by hand. Each area declares what it wants in cases.toml, and for the unicode areas that is the whole input rather than a sample of it.
      - name: Run
        env:
          CASES: ${{ inputs.cases }}
          # The run number rather than the clock, so a failing night can be reproduced exactly by dispatching the same seed by hand.
          SEED: ${{ inputs.seed || github.run_number }}
          AREA: ${{ matrix.area }}
        run: |
          pixi run -e oracle differ "$AREA" ${CASES:+--count "$CASES"} --seed "$SEED" --show 20 2>&1 | tee "differ-$AREA.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: differ-${{ matrix.area }}
          path: differ-*.log
          retention-days: 30

  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default
          locked: true
          cache: true
      # Every parser that reads bytes it did not produce is a target, and the assertion for all of them is the same and weaker than it looks: any input either parses or raises.
      # Never aborts, never allocates without bound, never loops forever. Mojo's bounds checking makes memory safety findings unlikely, which moves the value here to resource exhaustion and to the differential oracle.
      - name: Run
        env:
          SEED: ${{ inputs.seed || github.run_number }}
        run: pixi run fuzz --seed "$SEED" --minutes 90 2>&1 | tee fuzz.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz
          path: |
            fuzz.log
            fuzz/crashes/
          retention-days: 30

  report:
    name: open an issue on a disagreement
    runs-on: ubuntu-24.04
    needs: [differ, fuzz]
    if: failure()
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - name: Write the issue body
        run: |
          {
            echo "The differential suite found a case where this library and the reference implementation do not agree, or a fuzzer found an input that did something other than parse or raise."
            echo "The job name says which area it was."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Seed: ${{ github.run_number }}"
            echo
            echo "The failing cases are printed in the log and in the uploaded artifact, in hex, in the form the matching harness reads."
            echo "Reproduce one with the same seed, then turn it into a unit test before changing anything, because the fix belongs next to the rule it is about and not in the harness."
            echo
            echo "Accepting something the reference rejects is the direction that matters. Being stricter than the reference is expected and is not on its own a bug, but it still needs a line in docs/deviations.md."
          } > issue.md
      - uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Differential suite found a disagreement"
          content-filepath: issue.md
          # Quoted because the area label has a colon in it and YAML would take that as the start of another key.
          labels: "security, area: testing"
