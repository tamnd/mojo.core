[package]
name = "core.bufio"
go = "bufio"
verdict = "Port"
tier = 2
# `core.bytes` belongs here and is not listed, because it has no code yet and
# the linter checks that a declaration is really imported. The searching this
# package needs is a loop over a span, which is why its absence costs nothing.
unsafe = false
deps = [
  "core.errors",
  "core.io",
  "core.iter",
  "core.unicode.utf8",
]
