[package]
name = "core.os"
go = "os"
verdict = "Adapt"
tier = 4
unsafe = true
# `core.time` comes back with the deadline methods on `File` and with
# `chtimes`. Nothing here needs it yet, and the lint is right to say so: a
# declared dependency nothing imports is a claim about the graph that happens
# not to be true.
deps = [
  "core.errors",
  "core.io",
  "core.io.fs",
  "core.sort",
  "core.syscall",
]
