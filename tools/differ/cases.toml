# The declared differ areas, one table each. `mojo` is our side, `oracle` is
# the thing we are checked against, `needs` are the executables that have to be
# on PATH for the area to run at all. An area whose tools are missing is
# skipped and says so, because a host without Go is a host that can still run
# every other check in this repository.
#
# Both commands are given `--count` and `--seed`, and both are run from the
# repository root. What those two mean is the area's business. The unicode
# areas ignore the seed and start at code point zero every time, because there
# is nothing random about a character database and because then the case index
# the differ reports is the code point that diverged.
#
# `count` is what the area asks for when nobody says otherwise. `--count` on
# the command line still wins, which is how a divergence gets narrowed from a
# million lines to the hundred around it.
#
# The table in docs/testing.md says what each area is for.

[area.unicode-runes]
# Every answer core.unicode gives about a code point, against Go's, one line
# each. Every code point there is, because the tables here are derived from the
# Unicode files rather than translated from Go's, so nothing about them is true
# by construction, and a range table is wrong in one block and right everywhere
# else. It takes about fifteen seconds and it is the check issue #19 closed on.
count = 1114112
mojo = ["mojo", "run", "-I", ".", "tools/differ/mojo/unicode_runes.mojo"]
oracle = ["go", "run", "-C", "tools/differ/go", "./unicoderunes"]
needs = ["mojo", "go"]

[area.unicode-tables]
# The data behind those answers: every range of every one of the 236 tables,
# every case range and every category alias. Around seven and a half thousand
# lines, whole every time, so --count and --seed are accepted and ignored by
# both sides. This is the area that would catch a generator that produced a
# correct answer from a table that happens to be wrong outside the range the
# other area sampled.
mojo = ["mojo", "run", "-I", ".", "tools/differ/mojo/unicode_tables.mojo"]
oracle = ["go", "run", "-C", "tools/differ/go", "./unicodetables"]
needs = ["mojo", "go"]

[area.strconv-floats]
# Every way core.strconv writes a float, against Go's, one line per float, and
# the shortest form read back at the end of the line so that the parser has to
# agree with the formatter. The floats are generated rather than tabled: both
# sides run the same splitmix64 and pick between four shapes, because uniformly
# random bits are almost all enormous exponents and the failures worth finding
# are near one, near zero and on numbers a person would type.
#
# `build` rather than `mojo`, because the driver reaches core.errors and the
# thread local slot behind that is C that has to be linked in. `cc` is in
# `needs` for the same reason.
count = 200000
build = "tools/differ/mojo/strconv_floats.mojo"
oracle = ["go", "run", "-C", "tools/differ/go", "./strconvfloats"]
needs = ["mojo", "go", "cc"]

[area.strconv-parse]
# Every way core.strconv reads a number, against Go's, one line per string, with
# the failures named rather than compared as values, since a raise carries none.
# Eight shapes of input, two of which are the long digit strings and the extreme
# exponents that reach the exact decimal path behind Eisel-Lemire, which is
# where a parser that is nearly right stops being right.
count = 200000
build = "tools/differ/mojo/strconv_parse.mojo"
oracle = ["go", "run", "-C", "tools/differ/go", "./strconvparse"]
needs = ["mojo", "go", "cc"]

[area.strconv-float32]
# Every float32 there is, written out and read back, one line per block of a
# million of them holding a hash of the block's output and the number of round
# trips that did not land back on the bits they started as. 4096 blocks is all
# 4,294,967,296 floats, which is the exhaustive check issue #21 closes on, and a
# hash rather than the strings because the strings are two hundred gigabytes.
# --count narrows a rerun to the block a divergence names, and --seed is
# accepted and ignored, since an enumeration has nothing random in it.
count = 4096
build = "tools/differ/mojo/strconv_float32.mojo"
oracle = ["go", "run", "-C", "tools/differ/go", "./strconvfloat32"]
needs = ["mojo", "go", "cc"]

[area.time-zones]
# Every answer core.time gives about an instant in a real time zone, against
# Go's, one line each: the calendar fields, the zone name and offset, both zone
# bounds, the printed form, the wall clock reading turned back into an instant
# by `date`, and the same date a month later. The four locations are the four
# vendored slim TZif files, read by both sides through the same
# LoadLocationFromTZData, so neither side touches the host's zone database and
# a machine with no /usr/share/zoneinfo gives the same answer.
#
# The instants land anywhere between 1880 and 2120, which reaches the local
# mean time zone at the front of every file and the trailing POSIX rule at the
# back of the slim ones. The one that finds the interesting failures is the
# `date` round trip, since a wall clock reading in the hour daylight saving
# skipped names no instant and one it repeated names two.
#
# `build` rather than `mojo`, because the driver reaches core.errors and the
# thread local slot behind that is C that has to be linked in. `cc` is in
# `needs` for the same reason.
count = 200000
build = "tools/differ/mojo/time_zones.mojo"
oracle = ["go", "run", "-C", "tools/differ/go", "./timezones"]
needs = ["mojo", "go", "cc"]
