# What to harvest, and from where.
#
# A file rather than a flag, so adding a Go package to the harvest is a change
# somebody looked at. Every table named here has to exist in the Go tree the
# tool is run against, and the extractor fails rather than skipping when one
# does not, because a table quietly disappearing after a Go upgrade would take
# its test coverage with it and say nothing.
#
# The names are Go's, exactly. What they are called here is derived: `vfacosSC`
# becomes `vfacos_sc_rows()`.

[harvest.math]
go = "math"
# Go's math tests come in three parts and all of them are here. The ten element
# tables at the top of all_test.go are the ordinary values, checked to 1e-14 or
# 4e-16 depending on the function. The `SC` tables are the special cases, the
# infinities and the zeros and the not a numbers, which is where an
# implementation that wraps a system library diverges from Go and so is the
# half that decides whether a function can be a wrapper at all. The `BC`
# tables are the boundary cases for the three functions that take an exponent.
tables = [
  # The inputs every ordinary table is read against, and the ordinary answers.
  "vf",
  "acos", "acosh", "asin", "asinh", "atan", "atanh", "atan2",
  "cbrt", "ceil", "copysign", "cos", "cosLarge", "cosh",
  "erf", "erfc", "erfinv", "exp", "expm1", "expm1Large", "exp2",
  "fabs", "fdim", "floor", "fmod", "frexp", "gamma",
  "j0", "j1", "j2", "jM3", "lgamma",
  "log", "logb", "log10", "log1p", "log2", "modf",
  "nextafter32", "nextafter64", "pow", "remainder", "round",
  "signbit", "sin", "sinLarge", "sinh", "sqrt", "tan", "tanLarge", "tanh",
  "trunc", "y0", "y1", "y2", "yM3",

  # The special cases, input and answer together.
  "vfacosSC", "acosSC",
  "vfacoshSC", "acoshSC",
  "vfasinSC", "asinSC",
  "vfasinhSC", "asinhSC",
  "vfatanSC", "atanSC",
  "vfatanhSC", "atanhSC",
  "vfatan2SC", "atan2SC",
  "vfcbrtSC", "cbrtSC",
  "vfceilSC", "ceilSC", "floorSC", "truncSC",
  "vfcopysignSC", "copysignSC",
  "vfcosSC", "cosSC",
  "vfcoshSC", "coshSC",
  "vferfSC", "erfSC",
  "vferfcSC", "erfcSC",
  "vferfinvSC", "erfinvSC",
  "vferfcinvSC", "erfcinvSC",
  "vfexpSC", "expSC",
  "vfexp2SC", "exp2SC",
  "vfexpm1SC", "expm1SC",
  "vffabsSC", "fabsSC",
  "vffdimSC", "vffdim2SC", "fdimSC", "fmaxSC", "fminSC",
  "vffmodSC", "fmodSC",
  "vffrexpSC", "frexpSC",
  "vfgamma",
  "vfhypotSC", "hypotSC",
  "ilogbSC",
  "vfj0SC", "j0SC", "j1SC", "j2SC", "jM3SC",
  "vfldexpSC", "ldexpSC",
  "vflgammaSC", "lgammaSC",
  "vflogSC", "logSC",
  "vflogbSC", "logbSC",
  "vflog1pSC", "log1pSC",
  "vfmodfSC", "modfSC",
  "vfnextafter32SC", "nextafter32SC",
  "vfnextafter64SC", "nextafter64SC",
  "vfpowSC", "powSC",
  "vfpow10SC", "pow10SC",
  "vfroundSC", "vfroundEvenSC",
  "vfsignbitSC", "signbitSC",
  "vfsinSC", "sinSC",
  "vfsinhSC", "sinhSC",
  "vfsqrtSC", "sqrtSC",
  "vftanhSC", "tanhSC",
  "vfy0SC", "y0SC", "y1SC", "y2SC", "yM3SC",

  # The boundary cases, and the two tables that are neither.
  "vffrexpBC", "frexpBC",
  "vfldexpBC", "ldexpBC",
  "logbBC",
  "fmaC",
  "sqrt32",

  # The huge argument reduction tables, from huge_test.go. These are the ones
  # that say whether the Payne-Hanek reduction behind sin, cos and tan is
  # there at all, since a naive reduction is right up to about 2**20 and
  # nowhere near right at 2**500.
  "trigHuge", "cosHuge", "sinHuge", "tanHuge",
]

[harvest.cmplx]
go = "math/cmplx"
# Go tests this package from the inside, so `NaN()` in a table is cmplx's own
# NaN and the extractor dot imports the package to keep it meaning that. The
# shape is the same as math: `vc` is the ten inputs every ordinary table is
# read against, the `SC` tables are the special cases with their own inputs
# beside them, and `branchPoints` is the pair of points either side of every
# branch cut, which is the table that says whether the sign of a zero survived.
tables = [
  # The inputs every ordinary table is read against, and the ordinary answers.
  "vc",
  "abs", "acos", "acosh", "asin", "asinh", "atan", "atanh",
  "conj", "cos", "cosh", "exp", "log", "log10", "polar", "pow",
  "sin", "sinh", "sqrt", "tan", "tanh",

  # The special cases, input and answer together.
  "vcAbsSC", "absSC",
  "acosSC", "acoshSC", "asinSC", "asinhSC", "atanSC", "atanhSC",
  "vcConjSC", "conjSC",
  "cosSC", "coshSC", "expSC",
  "vcIsNaNSC", "isNaNSC",
  "logSC", "log10SC",
  "vcPolarSC", "polarSC",
  "vcPowSC", "powSC",
  "sinSC", "sinhSC", "sqrtSC", "tanSC", "tanhSC",

  # The branch cuts, and the huge arguments from huge_test.go, which are what
  # say whether tan reduces its argument the way Go does.
  "branchPoints",
  "hugeIn", "tanHuge",
]

[harvest.rand]
go = "math/rand/v2"
# Three test files' worth. `regressGolden` is the one that matters: 340 values,
# twenty from each of the seventeen methods of a `Rand` built on `NewPCG(1, 2)`,
# in the alphabetical order reflect walks methods in. It is a `[]any`, so it
# comes out here as one list per Go type rather than one list, and the test
# walks the same seventeen methods in the same order. The chacha8 tables are the
# generator's own output, its marshalled forms and the hash of a long run of it,
# which together say whether the block function, the reseed and the encoding
# are all right rather than merely consistent with each other.
tables = [
  "testSeeds",
  "chacha8seed", "chacha8output", "chacha8hash",
  "chacha8marshal", "chacha8marshalread",
  "regressGolden",
]
# `var rn, kn, wn, fn = GetNormalDistributionParameters()` and its exponential
# twin call into export_test.go, which is inside the package and not reachable
# from a copy of the declarations. Both are the ziggurat tables, which are in
# core/math/rand/tables.mojo already and are the thing under test rather than
# something to test against, so there is nothing lost in leaving them behind.
skip = ["rn", "kn", "wn", "fn", "re", "ke", "we", "fe"]

[harvest.fmt]
go = "fmt"
# The one entry that generates code rather than data, because a format string
# is a compile time parameter here and a table walked by a loop cannot carry
# one. See tools/testgen/fmtcases, which also explains which rows of Go's
# table can be ported and which cannot.
mode = "calls"
file = "fmt_test.go"

[harvest.path]
go = "path"
# Every table in the package, which between them are the whole of what `path`
# promises. `cleantests` is the interesting one: 44 rows of the rewriting rules
# that make two spellings of a path the same string, including the ones that
# look like they should be symmetrical and are not, and it is read twice
# because `Clean` of an already clean path has to be the same string again.
# `matchTests` comes from the other test file and carries an `err` field, which
# is `nil` on every row that is not one of the six bad patterns.
tables = [
  "cleantests",
  "splittests",
  "jointests",
  "exttests",
  "basetests",
  "dirtests",
  "isAbsTests",
  "matchTests",
]

[harvest.fs]
go = "io/fs"
file = "fs_test.go"
# The one table in the package that can be read without a tree of files to read
# it against: the names `ValidPath` accepts and the ones it refuses. The rest of
# the package's tests build a filesystem first, so they arrive when the `fs.FS`
# trait does.
tables = [
  "isValidPathTests",
]

[harvest.filepath]
go = "path/filepath"
# The lexical tables, which is every table in the package that does not need a
# tree on a disk to be read against. The `win` and `plan9` ones are left out
# because they are answers for hosts this library does not target, and the
# `nonwin` ones are in because this is one of the hosts they are for. Go splits
# `splittests` and `cleantests` that way and this file has to put the halves
# back together, which is what the two `nonwin` names below are doing.
#
# `localizetests` is not here and is ported by hand in the test file, because
# one of its rows is the string `a\xffb` and a Mojo string literal holds text
# rather than bytes, so that row has to be built as bytes to exist at all.
tables = [
  "cleantests",
  "nonwincleantests",
  "slashtests",
  "unixsplittests",
  "jointests",
  "nonwinjointests",
  "exttests",
  "basetests",
  "dirtests",
  "nonwindirtests",
  "isabstests",
  "islocaltests",
  "splitlisttests",
  "reltests",
]

[harvest.time]
go = "time"
# The tables Go's own time tests are driven by, less the ones whose rows hold a
# `Time` or a `*Location`. Reflection cannot read a `time.Time`, whose fields
# are all unexported, and a `*Location` is a pointer into a zone database this
# library does not have yet, so those tables are ported by hand in the test file
# and say so there.
#
# What is here is the calendar and the durations. `isoWeekTests` alone is 130
# rows of the rule that a week belongs to the year its Thursday is in, which is
# the part of the calendar most likely to be got subtly wrong, and `yearDayTests`
# walks the leap year rule across four centuries.
tables = [
  "daysInTests",
  "isoWeekTests",
  "yearDayTests",
  "addDateTests",
  "durationTests",
  "durationTruncateTests",
  "durationRoundTests",
  "durationAbsTests",
  "nsDurationTests",
  "usDurationTests",
  "msDurationTests",
  "secDurationTests",
  "minDurationTests",
  "hourDurationTests",
]
# Four declarations cannot come along. `goStringTests`, `mallocTest` and
# `slimTests` write `time.Time` with the package qualifier, and the copy these
# declarations are moved into dot imports `time` the way most of Go's own time
# tests do, so the qualifier has nothing to resolve against. `subTests` is built
# out of `MinMonoTime`, which internal_test.go declares by reaching into the
# packed representation of a `Time` from inside the package. None of the four is
# a table this could use: the first three are about formatting and about
# allocation counts, and the fourth is the monotonic saturation case, which is
# tested here by hand instead.
skip = ["goStringTests", "mallocTest", "slimTests", "subTests"]
