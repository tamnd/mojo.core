# Symbols whose Mojo name the rules in rules.py could not derive.
#
# The rules turn CamelCase into snake_case by splitting at a capital letter,
# which is right for almost everything and wrong wherever a run of capitals is
# a word. `NaN` is one word and the rule reads it as two.
#
# Also here are the handful of places where Mojo spells something as an
# operator that Go spells as a method. Those are not failures of the rule, they
# are the point of having this file: no rule about capital letters was ever
# going to work out that `Len` is `__len__`.
#
# Keyed by Go package, then by the Go symbol. Members are Owner.Member on both
# sides. Adding a line here is a review conversation about a name, which is the
# right size of thing to argue about.

["math"]
NaN = "nan"
IsNaN = "is_nan"

["math/cmplx"]
NaN = "nan"
IsNaN = "is_nan"

["sync"]
# The reader lock, not an `r_lock` of any kind.
"RWMutex.TryRLock" = "RWMutex.try_rlock"
"RWMutex.RLock" = "RWMutex.rlock"
"RWMutex.RUnlock" = "RWMutex.runlock"
"RWMutex.RLocker" = "RWMutex.rlocker"

["crypto/tls"]
# CAs is the plural of CA, and the rule reads the final s as a word.
"Config.ClientCAs" = "Config.client_cas"
"Config.RootCAs" = "Config.root_cas"
"CertificateRequestInfo.AcceptableCAs" = "CertificateRequestInfo.acceptable_cas"

["image"]
# YCbCr is one colour model and NYCbCrA is that model with alpha.
NewYCbCr = "new_ycbcr"
NewNYCbCrA = "new_nycbcra"
"YCbCr.YCbCrAt" = "YCbCr.ycbcr_at"
"NYCbCrA.NYCbCrAAt" = "NYCbCrA.nycbcra_at"

["image/color"]
RGBToYCbCr = "rgb_to_ycbcr"
YCbCrToRGB = "ycbcr_to_rgb"

["errors"]
# `is` is a Mojo keyword. `matches` is what the call reads as anyway:
# `matches(e, io.EOF)`.
Is = "matches"

["io"]
# The seek constants are `comptime` values rather than variables, and this
# library spells a constant in capitals. The rule turns `SeekStart` into
# `seek_start`, which would be a function.
SeekStart = "SEEK_START"
SeekCurrent = "SEEK_CURRENT"
SeekEnd = "SEEK_END"

["bufio"]
# The token ceiling is a `comptime` value, and this library spells a constant in
# capitals for the same reason `io`'s seek constants are above.
MaxScanTokenSize = "MAX_SCAN_TOKEN_SIZE"
# Go's four split functions are functions. Here a split function is a type
# implementing `Splitter`, because a stored closure has nowhere to keep what it
# captured and a function type cannot be parametric over an origin, which is
# `design.md` section 3. So each of these keeps its Go name and is a struct,
# and the rule that lowercases a function name is the thing that is wrong here.
ScanBytes = "ScanBytes"
ScanLines = "ScanLines"
ScanRunes = "ScanRunes"
ScanWords = "ScanWords"
SplitFunc = "Splitter"
# `Scan` is `has_next`, because the scanner is a `core.iter.Cursor` and the loop
# it is written for is `while s.has_next()`. Same call, same place, and the
# failure comes out of it instead of being left in `Err`.
"Scanner.Scan" = "Scanner.has_next"

["unicode"]
# `is` and `in` are both Mojo keywords, and these two are the pair of questions
# the package exists to answer, so they had to keep reading as questions.
# `is_in(unicode.Greek, r)` asks whether one table has a code point and
# `in_any(r, unicode.L, unicode.N)` asks whether any of several do, which is
# what Go's one word names mean once you have looked them up.
Is = "is_in"
In = "in_any"
# The constants, in capitals for the same reason `io`'s seek constants are.
# `MaxRune` under the usual rule would be `max_rune`, which reads as a function
# that computes one.
MaxRune = "MAX_RUNE"
MaxASCII = "MAX_ASCII"
MaxLatin1 = "MAX_LATIN1"
MaxCase = "MAX_CASE"
UpperCase = "UPPER_CASE"
LowerCase = "LOWER_CASE"
TitleCase = "TITLE_CASE"
ReplacementChar = "REPLACEMENT_CHAR"
UpperLower = "UPPER_LOWER"
Version = "VERSION"

["unicode/utf8"]
# The four constants, in capitals for the same reason `io`'s seek constants are.
# `RuneError` under the usual rule would be `rune_error`, which reads as a
# function that produces one rather than the code point it is.
MaxRune = "MAX_RUNE"
RuneError = "RUNE_ERROR"
RuneSelf = "RUNE_SELF"
UTFMax = "UTF_MAX"

["cmp"]
# `or` is a Mojo keyword. `first_non_zero(a, b)` is what `cmp.Or(a, b)` means,
# and unlike `or_else` it keeps reading correctly at three arguments and at
# five. Same trade as `errors.Is` becoming `matches` above.
Or = "first_non_zero"

["sort"]
# `Len` is `__len__` so that `len(data)` works on anything sortable and there
# is not a second spelling of the language's own question sitting next to it.
"Interface.Len" = "Interface.__len__"
"IntSlice.Len" = "IntSlice.__len__"
"Float64Slice.Len" = "Float64Slice.__len__"
"StringSlice.Len" = "StringSlice.__len__"
# Go's `Reverse` is a function returning an `Interface` that embeds the
# original. There is no embedding here and no interface value to return, so it
# is a struct that points at the data, and `Reverse(view)` still reads the
# same at the call site.
Reverse = "Reverse"

["bytes"]
# The minimum a `read_from` chunk is sized at is a `comptime` value, and this
# library spells a constant in capitals for the same reason `bufio`'s token
# ceiling is above.
MinRead = "MIN_READ"

["strconv"]
# The width of an `Int` in bits is a `comptime` value, capitalised for the same
# reason `bytes.MinRead` above is.
IntSize = "INT_SIZE"

["math/bits"]
# The width of a `UInt` in bits, capitalised on the same rule as
# `strconv.IntSize` above.
UintSize = "UINT_SIZE"
