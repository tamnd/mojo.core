InvalidUnmarshalError = "What Go returns when Unmarshal is handed a nil or a non pointer. `unmarshal` takes a mut Unmarshaler, so both are compile errors."
"InvalidUnmarshalError.Type" = "What Go returns when Unmarshal is handed a nil or a non pointer. `unmarshal` takes a mut Unmarshaler, so both are compile errors."
"InvalidUnmarshalError.Error" = "What Go returns when Unmarshal is handed a nil or a non pointer. `unmarshal` takes a mut Unmarshaler, so both are compile errors."
UnsupportedTypeError = "What Go's reflection returns on meeting a channel or a function. A type that cannot write itself is a compile error at the call to marshal."
"UnsupportedTypeError.Type" = "What Go's reflection returns on meeting a channel or a function. A type that cannot write itself is a compile error at the call to marshal."
"UnsupportedTypeError.Error" = "What Go's reflection returns on meeting a channel or a function. A type that cannot write itself is a compile error at the call to marshal."

# The last one is a wrapper whose only content is a name Mojo cannot produce.
# MarshalerError puts the type and the calling method in front of whatever a
# MarshalJSON returned, and Unwrap is how a caller gets back to the error
