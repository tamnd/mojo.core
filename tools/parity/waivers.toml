"MarshalerError.Type" = "Go's wrapper around what a MarshalJSON returned, naming the type. Mojo cannot name a type at run time, and the raise comes back unchanged."
"MarshalerError.Err" = "Go's wrapper around what a MarshalJSON returned, naming the type. Mojo cannot name a type at run time, and the raise comes back unchanged."
"MarshalerError.Error" = "Go's wrapper around what a MarshalJSON returned, naming the type. Mojo cannot name a type at run time, and the raise comes back unchanged."
"MarshalerError.Unwrap" = "Go's wrapper around what a MarshalJSON returned, naming the type. Mojo cannot name a type at run time, and the raise comes back unchanged."

