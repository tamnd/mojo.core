SEEK_SET = "Deprecated in Go. Use core.io.SEEK_START."
SEEK_CUR = "Deprecated in Go. Use core.io.SEEK_CURRENT."
SEEK_END = "Deprecated in Go. Use core.io.SEEK_END."
