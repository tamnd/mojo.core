AfterFunc = "Runs the function on a goroutine. There is no goroutine until M9."

["encoding/csv"]
# Two deprecations and one thing the language does not have.
#
# Go's documentation says of both trailing comma symbols that they are no
# longer used. The field is read nowhere in Go's own package and the sentinel
# is returned by nothing, so implementing them here would be adding a field
# that nothing looks at and a code that nothing raises.
#
# ReuseRecord asks Read to return a slice sharing the backing array of the
# previous call's, which is a promise about aliasing. A record here is an owned
# List[String] handed to the caller, and two owned values do not share storage,
# so there is nothing the setting could turn on. Go's own documentation says
# the sharing "may" happen, so a reader that never shares is inside its
# contract; this one never shares and says so rather than carrying a field that
# does nothing.
"Reader.TrailingComma" = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package reads it."
ErrTrailingComma = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
"Reader.ReuseRecord" = "A promise that two returned slices share storage. A record here is an owned List[String], so there is nothing to share."

["encoding/json"]
# A switch with one position, because the other position does not exist here.
#
# UseNumber tells Go's decoder to read a number into an `any` as a Number
# rather than as a float64, which is a choice Go has to offer because its
# default loses digits. Every number on the token path here is already a
# Number, and a Document keeps a number as the text the document wrote, so
# both of the things the flag chooses between are the same thing. Turning it
# on would change nothing and leaving it off changes nothing either, so the
# setting would be a field that reads back what was put in it.
"Decoder.UseNumber" = "A switch between a float64 and a Number. Every number here is already a Number, so there is nothing to switch."

# Five of Go's eight error types, for three different reasons. Every one of
# them holds a reflect.Type, which is what a walk over an unknown value has to
# carry to say anything at all about what it met, and the two that are here
# are the two that do not need one: `UnmarshalTypeError` is handed the name by
# the call that failed, and `UnsupportedValueError` names a value rather than a
# type.
#
# Two are deprecated in Go's own documentation and nothing in Go returns
# either. InvalidUTF8Error says a string held bytes that are not UTF-8, which
# Go's encoder stopped refusing years ago and now writes as U+FFFD.
# UnmarshalFieldError says a document had a key no field matched, which Go's
# decoder stopped treating as an error before that.
InvalidUTF8Error = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
"InvalidUTF8Error.S" = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
"InvalidUTF8Error.Error" = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
UnmarshalFieldError = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
"UnmarshalFieldError.Key" = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
"UnmarshalFieldError.Type" = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
"UnmarshalFieldError.Field" = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."
"UnmarshalFieldError.Error" = "Deprecated in Go. Go's own documentation says it is no longer used, and nothing in Go's package returns it."

# Two are what Go returns when a program hands its walk something the walk
# cannot deal with, and both of those mistakes are a compile error here rather
# than a value that comes back. InvalidUnmarshalError is a nil or a value that
# is not a pointer, and there is no nil and nothing to point with: `unmarshal`
