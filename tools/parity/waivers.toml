# Symbols inside a package we are implementing that we are deliberately not
# implementing, one line each with a reason.
#
# This is the machine readable form of the excluded list in docs/packages.md,
# for the cases too small to be a whole row. A package we are not writing at
# all has no PACKAGE.toml and needs nothing here.
#
# The reason has to be about Go rather than about effort. "Deprecated in Go's
# own documentation" is a reason. "Hard" is not, and a reviewer should say so.
#
# This file growing is the signal that the contract is being negotiated away
# rather than met, which is why it is a reviewed file and not a flag, and why
# `pixi run parity` prints how many lines are in it every time it runs.

["crypto/elliptic"]
# Go's own documentation says these are deprecated and that custom curves are
# not supported, are not constant time and should not be used. The named curves
# stay, and they go through OpenSSL, which has no entry point for arithmetic on
# a curve somebody made up.
"Curve.Add" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"Curve.Double" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"Curve.IsOnCurve" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"Curve.ScalarBaseMult" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"Curve.ScalarMult" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"CurveParams.Add" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"CurveParams.Double" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"CurveParams.IsOnCurve" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"CurveParams.ScalarBaseMult" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."
"CurveParams.ScalarMult" = "Deprecated in Go. Custom curve arithmetic, which OpenSSL does not expose."

["errors"]
# Both are Go's reflection based type assertion, and there is no reflection
# here, which is design.md section 8. There is also nothing to assert against,
# because Mojo has one error type carrying a string, which is section 4. The
# replacement is not a single function: `errors.field` reads the values a Go
# error struct would have held, `errors.matches` compares a sentinel, and a
# package that wants Go's shape supplies its own, such as `os.PathError.of(e)`.
As = "No reflection and no error hierarchy. Use errors.field, errors.matches, or the package's own `of` helper."
AsType = "No reflection and no error hierarchy. Use errors.field, errors.matches, or the package's own `of` helper."

["iter"]
# All four of Go's symbols here are the range over func protocol. `Seq` is
# `func(yield func(V) bool)`, so the sequence is a closure and iterating it
# means storing another one, and design.md section 3 says a closure that
# captures can be passed down but not kept. `Pull` turns a `Seq` into a next
# and stop pair, which is the shape this library uses everywhere, but it gets
# there by taking a `Seq` and so needs the same thing.
#
# What replaces them is `core.iter.Cursor`, which is that next and stop pair
# written as a trait instead of derived from a closure at run time. There is
# no `Cursor2`, because Go needs `Seq2` only to give a range over func a second
# yield argument and a `Cursor` whose `Element` is a tuple covers it.
Pull = "Range over func. Needs a storable closure, section 3. Write a core.iter.Cursor."
Pull2 = "Range over func. Needs a storable closure, section 3. Write a core.iter.Cursor."
Seq = "Range over func. Needs a storable closure, section 3. Write a core.iter.Cursor."
Seq2 = "Range over func. Needs a storable closure, section 3. Write a core.iter.Cursor."

["io"]
# An in memory pipe is one goroutine writing while another reads, and every
# one of Go's methods here blocks until the other side shows up. That needs a
# mutex and a condition variable, which are `core.sync` in M4, and writing it
# against nothing would produce a pipe that deadlocks on the first use.
#
# `ErrClosedPipe` is already in `core/errors/codes.toml`, so the sentinel
# exists where the rest of the io sentinels are and the number will not move
# when the pipe arrives. Issue #112 records the decision.
Pipe = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
PipeReader = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
PipeWriter = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
"PipeReader.Close" = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
"PipeReader.CloseWithError" = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
"PipeReader.Read" = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
"PipeWriter.Close" = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
"PipeWriter.CloseWithError" = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."
"PipeWriter.Write" = "Blocking handoff between two threads. Needs core.sync, M4, issue #112."

["bufio"]
# The scanner is a `core.iter.Cursor`, and the whole reason that trait exists is
# `Scanner.Err`: Go's loop ends the same way whether the input finished or the
# disk broke, and the difference is in a method called after the loop that is
# easy to leave out. `has_next` raises instead, so there is nothing left to ask.
"Scanner.Err" = "The scanner raises. core.iter.Cursor exists to remove this method."
# The splitter is a type parameter fixed when the scanner is built, so there is
# no setter to call and Go's "Split after Scan panics" is not expressible.
# `new_scanner(src^, ScanWords())` is the whole of it.
"Scanner.Split" = "The splitter is a type parameter. Pass it to new_scanner; it cannot change mid scan."
# Go's one place where an error is not a failure. Here a split function returns
# `Split.last(...)` or `Split.stop_here()`, so the error channel only ever
# carries failures and a sentinel that means success cannot be raised by
# accident.
ErrFinalToken = "Not an error. `Split.last` and `Split.stop_here` carry it as data."
# Go hands out the writer's own free space so a caller can append into it and
# hand it back, which saves a copy. A Mojo `Span` has no capacity to append into
# and a `List` would reallocate somewhere else, so there is no translation that
# keeps the property the method exists for. `write` and `write_string` are the
# replacement and they copy once.
"Writer.AvailableBuffer" = "Appending into the writer's own memory. A Span has no capacity and a List reallocates."
"ReadWriter.AvailableBuffer" = "Appending into the writer's own memory. A Span has no capacity and a List reallocates."
# Go's embedding, not a symbol. `ReadWriter` here has a `reader` and a `writer`
# field and forwards by hand, `design.md` on method promotion.
"ReadWriter.embedded" = "Go's embedding. The two halves are named fields and the forwarding is written out."

["bytes"]
# Go's own documentation deprecates it: the rule it applies does not handle
# Unicode punctuation, so it upper cases the letter after an apostrophe and
# turns "they're" into "They'Re". Go points at golang.org/x/text/cases, and
# `to_title` here is the rune wise mapping that `unicode.to_title` names, which
# is the part that was never wrong.
Title = "Deprecated in Go. The word boundary rule breaks on Unicode punctuation; x/text/cases replaces it."
# The same as `bufio.Writer.AvailableBuffer` above, and a second reason on top
# of it: this package's rule is that no method hands out a view into the
# buffer's own storage, because the next write can reallocate and in Mojo that
# view would then be reading freed memory rather than stale bytes.
"Buffer.AvailableBuffer" = "Appending into the buffer's own memory. A Span has no capacity and the next write can reallocate."

["strings"]
# The same deprecation as `bytes.Title` above, and it is the more visible of
# the two, since a function named `Title` in a string package is the one a
# newcomer reaches for to capitalise a heading. Go's own documentation says not
# to: the word boundary rule is "any letter after a non letter", so "they're"
# becomes "They'Re" and "don't" becomes "Don'T". Go points at
# golang.org/x/text/cases, which needs the Unicode word segmentation tables.
#
# `to_title` here is the rune wise mapping, which is Go's `ToTitle` and is the
# part that was never wrong. Capitalising words correctly is a text
# segmentation problem and belongs with the rest of that work, not in a one
# line loop over spaces.
Title = "Deprecated in Go. The word boundary rule breaks on Unicode punctuation; x/text/cases replaces it."

["math/big"]
# Both are Go's run time formatting interfaces. `Format` implements
# `fmt.Formatter`, which is handed a `fmt.State` and a verb rune and decides
# what to print by looking at them; `Scan` implements `fmt.Scanner`, which is
# handed a `fmt.ScanState` and reads. `core.fmt` is an Adapt in
# docs/packages.md: the format string is a `comptime` parameter and the verbs
# are typechecked when the program is compiled, so there is no `State` to be
# handed and no verb to inspect at run time.
#
# What stands in for `Format` is `Int.text`, which takes the base as a number,
# and `write_to`, which is what printing a value goes through. What stands in
# for `Scan` is `set_string`, which is the same parsing and reports a bad input
# by raising rather than through a scan state.
#
# `Rat.Scan` is the same interface on the rational type and goes the same way,
# with `Rat.set_string` in its place. `Rat` has no `Format`, because Go prints
# one through `String` alone.
"Int.Format" = "fmt.Formatter. Verbs are comptime in core.fmt, so there is no State to hand it. Use Int.text."
"Int.Scan" = "fmt.Scanner. Same reason, in the other direction. Use Int.set_string."
"Rat.Scan" = "fmt.Scanner. Same reason as Int.Scan. Use Rat.set_string."
