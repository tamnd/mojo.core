"ProcAttr.Sys" = "syscall.SysProcAttr is per platform and is not bound in core.syscall."

["os/exec"]
# Everything Go can do about a command it has decided to give up on, all of it
# built on a second goroutine watching a context while the first one waits.
# There is no second goroutine here and no context package, so a caller that
# wants to give up starts the command with `start`, waits however it likes, and
# calls `kill`.
CommandContext = "No context package and no goroutine to watch one from. Use start, then kill."
"Cmd.Cancel" = "The function CommandContext calls. Nothing calls it here."
"Cmd.WaitDelay" = "A grace period a watching goroutine enforces. There is no watching goroutine."
ErrWaitDelay = "Goes with Cmd.WaitDelay, which is waived."

# Go's `Command` cannot return an error, because it is written to be usable
# inside a struct literal, so a failed lookup is parked in a field and returned
# later from `Run`. `command` raises instead, and there is nothing left for the
# field to hold.
"Cmd.Err" = "command raises rather than parking the failure in a field."

# Go hangs the process attributes off a pointer to a per platform struct.
